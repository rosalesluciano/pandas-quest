<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PandasQuest</title>
  <meta name="description" content="Aprende ciencia de datos desde cero: Python, pandas, NumPy, Matplotlib, Seaborn y Machine Learning, con ejercicios que se corrigen al instante en tu navegador y en Google Colab.">
  <meta name="theme-color" content="#0e1a2b">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem("pq_theme"); } catch (e) {}
      if (!t) t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body>
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 5.5v13l11-6.5z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
    <symbol id="i-bug" viewBox="0 0 24 24"><path d="M9 7.5a3 3 0 0 1 6 0M8 10h8v4a4 4 0 0 1-8 0zM12 10v8M4.5 12H8M16 12h3.5M5 7.5l3 2.5M19 7.5l-3 2.5M5 18l3-2.5M19 18l-3-2.5"/></symbol>
    <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.3 1 2.2h5.2c0-.9.4-1.7 1-2.2A6 6 0 0 0 12 3z"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-table" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17M3.5 14.5h17M9.5 9.5v10"/></symbol>

    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4zM15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></symbol>

  </svg>

  <header class="topbar">
    <div class="topbar-in">
      <a class="logo" href="#/" aria-label="PandasQuest, ir al mapa">
        <svg class="logo-mark" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="#fff"/><circle cx="20" cy="20" r="14" fill="none" stroke="currentColor" stroke-width="5"/><text x="20" y="26.5" text-anchor="middle">P</text></svg>
        <span class="logo-text">Pandas<b>Quest</b></span>
      </a>
      <div class="instruments">
        <button class="inst level" id="levelPill" type="button" aria-label="Tu nivel y tus puntos de experiencia">
          <span class="inst-k">Nivel <b class="lvl-num">1</b></span>
          <span class="inst-v"><span class="lvl-name">Aprendiz</span><span class="xpbar"><i></i></span></span>
          <span class="inst-r"><b class="xp-num">0</b> XP<small class="xp-trend"></small></span>
        </button>
        <div class="inst streak" id="streakChip" title="Días seguidos practicando">
          <svg class="ic"><use href="#i-flame"/></svg>
          <span class="inst-r"><b class="streak-num">0</b> <span class="u">días</span><small class="streak-state"></small></span>
        </div>
        <div class="inst goal" id="goalChip" title="Meta diaria: 3 ejercicios">
          <span class="ticks" aria-hidden="true"><i></i><i></i><i></i></span>
          <span class="inst-r"><b class="goal-num">0</b>/3 <span class="u">hoy</span></span>
        </div>
        <div class="inst combo hidden" id="comboChip" title="Aciertos seguidos al primer intento">
          <svg class="ic"><use href="#i-bolt"/></svg><span class="inst-r">x<b>0</b></span>
        </div>
      </div>
      <div class="top-tools">
        <div class="py-status" id="pyStatus" role="status"><span class="lamp"></span><span class="txt">Cargando Python…</span></div>
        <button class="icon-btn" id="soundBtn" type="button" aria-label="Activar sonido"><svg class="ic"><use href="#i-mute"/></svg></button>
        <button class="icon-btn" id="themeBtn" type="button" aria-label="Cambiar a tema oscuro"><svg class="ic"><use href="#i-moon"/></svg></button>
      </div>
    </div>
    <div class="network-stripe" aria-hidden="true"></div>
  </header>

  <main id="app"></main>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <dialog class="dlg" id="dlg"><div class="dlg-card" id="dlgCard"></div></dialog>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/sql/sql.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/comment/comment.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/runmode/runmode.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

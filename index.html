<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PandasQuest</title>
  <meta name="description" content="Aprende Python pandas desde cero hasta nivel profesional con ejercicios prácticos que se corrigen al instante en tu navegador y en Google Colab.">
  <meta name="theme-color" content="#0d0b1e">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐼</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem("pq_theme"); } catch (e) {}
      if (!t && window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches) t = "light";
      document.documentElement.dataset.theme = t || "dark";
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <a class="logo" href="#/" aria-label="Inicio">
      <span class="logo-mark">🐼</span><span class="logo-text">Pandas<b>Quest</b></span>
    </a>
    <div class="top-stats">
      <div class="py-status" id="pyStatus" title="Estado de Python"><span class="dot"></span><span class="txt">Cargando Python…</span></div>
      <div class="chip streak" id="streakChip" title="Racha de días seguidos">🔥 <b>0</b></div>
      <div class="chip combo hidden" id="comboChip" title="Aciertos seguidos al primer intento">⚡ x<b>0</b></div>
      <button class="level-pill" id="levelPill" title="Tu nivel">
        <span class="lvl-num">1</span>
        <span class="lvl-info"><span class="lvl-name">Panda bebé</span><span class="xpbar"><i></i></span></span>
        <span class="xp-txt"><b>0</b> XP</span>
      </button>
      <button class="icon-btn" id="soundBtn" title="Sonido" aria-label="Activar o desactivar sonido">🔊</button>
      <button class="icon-btn" id="themeBtn" title="Tema claro / oscuro" aria-label="Cambiar tema">🌙</button>
    </div>
  </header>

  <main id="app"></main>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="modal hidden" id="modal" role="dialog" aria-modal="true">
    <div class="modal-card" id="modalCard"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/sql/sql.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/comment/comment.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/runmode/runmode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
